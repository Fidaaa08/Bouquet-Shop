<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f5ef">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin — Our Bouquets</title>
    <link rel="icon" type="image/jpeg" href="images/favicon.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <script type="module" src="js/admin.js"></script>
  </head>
  <body class="admin-page">
    <header class="admin-header">
      <a class="brand" href="index.html" aria-label="Kembali ke toko">
        <img src="images/header_logo.png" alt="Our Bouquets">
      </a>
      <a class="text-link" href="index.html">Lihat toko <span aria-hidden="true">↗</span></a>
    </header>

    <main class="admin-main">
      <section class="admin-login" id="admin-login">
        <p class="eyebrow"><span class="eyebrow-line"></span> Area khusus</p>
        <h1>Masuk ke <em>admin.</em></h1>
        <p class="admin-intro">Gunakan akun admin yang sudah dibuat di Supabase.</p>
        <p class="login-message" id="login-message" role="status"></p>
        <form class="admin-form login-form" id="login-form">
          <label>Email<input name="email" type="email" autocomplete="username" required></label>
          <label>Kata sandi<input name="password" type="password" autocomplete="current-password" required></label>
          <button class="button button-dark" type="submit">Masuk <span aria-hidden="true">↗</span></button>
        </form>
      </section>

      <section class="admin-dashboard" id="admin-dashboard" hidden>
        <div class="admin-title-row">
          <div>
            <p class="eyebrow"><span class="eyebrow-line"></span> Our Bouquets</p>
            <h1>Kelola <em>toko.</em></h1>
          </div>
          <button class="admin-secondary-button" id="logout-button" type="button">Keluar</button>
        </div>

        <p class="admin-message" id="admin-message" role="status"></p>

        <section class="admin-section" aria-labelledby="product-form-title">
          <div class="admin-section-heading">
            <h2 id="product-form-title">Tambah produk</h2>
            <button class="admin-secondary-button" id="cancel-edit" type="button" hidden>Batal edit</button>
          </div>
          <form class="admin-form product-form" id="product-form">
            <input name="productId" type="hidden">
            <label>Nama buket<input name="name" maxlength="100" required></label>
            <label>Kategori
              <select name="category" required>
                <option value="romantis">Romantis</option>
                <option value="selamat">Perayaan</option>
                <option value="sederhana">Untuk diri sendiri</option>
              </select>
            </label>
            <label>Harga (Rp)<input name="price" type="number" min="1" step="1" required></label>
            <label>Foto<input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label>
            <label class="form-wide">Deskripsi<textarea name="description" rows="3" maxlength="1000"></textarea></label>
            <label class="active-toggle"><input name="active" type="checkbox" checked> Tampilkan di toko</label>
            <button class="button button-dark" type="submit">Simpan produk <span aria-hidden="true">↗</span></button>
          </form>
        </section>

        <section class="admin-section" aria-labelledby="products-title">
          <h2 id="products-title">Daftar produk</h2>
          <div class="admin-product-list" id="admin-product-list"></div>
        </section>

        <section class="admin-section" aria-labelledby="orders-title">
          <h2 id="orders-title">Pesanan masuk</h2>
          <div class="admin-order-list" id="admin-order-list"></div>
        </section>
      </section>
    </main>
  </body>
</html>
